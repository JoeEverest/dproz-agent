<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Dproz Agent app icon</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
			}

			html,
			body {
				width: 1024px;
				height: 1024px;
				background: transparent;
			}

			body {
				display: grid;
				place-items: center;
			}

			/* macOS icons sit on an 824px rounded square inside the 1024px canvas; other platforms fill it. */
			.tile {
				display: grid;
				place-items: center;
				width: 824px;
				height: 824px;
				border-radius: 185px;
				background:
					radial-gradient(70% 70% at 15% 0%, #0a88ed, transparent 70%),
					linear-gradient(160deg, #0069cb, #0d4492);
				box-shadow:
					inset 0 2px 0 rgb(255 255 255 / 22%),
					0 14px 30px rgb(0 0 0 / 22%);
			}

			body.square .tile {
				width: 1024px;
				height: 1024px;
				border-radius: 224px;
				box-shadow: none;
			}

			img {
				width: 92%;
				margin-top: 3%;
			}
		</style>
	</head>
	<body>
		<div class="tile"><img src="../site/assets/logo-dark.svg" alt="" /></div>
	</body>
</html>
