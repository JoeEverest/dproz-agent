name: Release

# Push a tag like v0.2.0 (matching package.json) to build the installers and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, Apple Silicon
            os: macos-latest
          - name: Linux, x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Check the Dproz API key is configured
        shell: bash
        env:
          DPROZ_API_KEY: ${{ secrets.DPROZ_API_KEY }}
        run: |
          if [ -z "$DPROZ_API_KEY" ]; then
            echo "Set the DPROZ_API_KEY repository secret: gh secret set DPROZ_API_KEY" >&2
            exit 1
          fi

      - name: Build the installers
        run: npm run build && npx electron-builder --publish never
        env:
          DPROZ_API_KEY: ${{ secrets.DPROZ_API_KEY }}
          # Unsigned builds: no Developer ID certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --title "Dproz Agent ${GITHUB_REF_NAME#v}" --generate-notes
